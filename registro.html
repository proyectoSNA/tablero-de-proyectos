<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Proyectos Estatales</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --border: #cbd5e1;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
    }
    .form-container {
      background: var(--card-bg);
      max-width: 650px;
      width: 100%;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      box-sizing: border-box;
    }
    h2 { margin-top: 0; color: var(--primary); }
    .alert-box {
      background-color: #eff6ff;
      border-left: 4px solid var(--primary);
      padding: 1rem;
      font-size: 0.9rem;
      border-radius: 4px;
      margin-bottom: 1.5rem;
      line-height: 1.4;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    label {
      display: block;
      margin-bottom: 0.4rem;
      font-weight: 600;
      font-size: 0.9rem;
    }
    input, select, textarea {
      width: 100%;
      padding: 0.65rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
      box-sizing: border-box;
    }
    textarea { resize: vertical; min-height: 80px; }
    button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 0.85rem 1.5rem;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.2s;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    #msgStatus {
      margin-top: 1rem;
      text-align: center;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="form-container">
    <h2>Registro Oficial de Proyecto</h2>
    
    <div class="alert-box">
      <strong>Aviso Importante:</strong> Ingrese la información oficial de su entidad. La propuesta quedará en estado <em>Pendiente</em> y pasará por un proceso de revisión antes de ser publicada en el portal público.
    </div>

    <form id="projectForm">
      <div class="form-group">
        <label for="correo">Correo Institucional Oficial *</label>
        <input type="email" id="correo" required placeholder="enlace@gobierno.gob.mx">
      </div>

      <div class="form-group">
        <label for="estado">Entidad Federativa *</label>
        <select id="estado" required>
          <option value="" disabled selected>Seleccione un estado...</option>
          <option value="Aguascalientes">Aguascalientes</option>
          <option value="Baja California">Baja California</option>
          <option value="Baja California Sur">Baja California Sur</option>
          <option value="Campeche">Campeche</option>
          <option value="Chiapas">Chiapas</option>
          <option value="Chihuahua">Chihuahua</option>
          <option value="Ciudad de México">Ciudad de México</option>
          <option value="Coahuila">Coahuila</option>
          <option value="Colima">Colima</option>
          <option value="Durango">Durango</option>
          <option value="Estado de México">Estado de México</option>
          <option value="Guanajuato">Guanajuato</option>
          <option value="Guerrero">Guerrero</option>
          <option value="Hidalgo">Hidalgo</option>
          <option value="Jalisco">Jalisco</option>
          <option value="Michoacán">Michoacán</option>
          <option value="Morelos">Morelos</option>
          <option value="Nayarit">Nayarit</option>
          <option value="Nuevo León">Nuevo León</option>
          <option value="Oaxaca">Oaxaca</option>
          <option value="Puebla">Puebla</option>
          <option value="Querétaro">Querétaro</option>
          <option value="Quintana Roo">Quintana Roo</option>
          <option value="San Luis Potosí">San Luis Potosí</option>
          <option value="Sinaloa">Sinaloa</option>
          <option value="Sonora">Sonora</option>
          <option value="Tabasco">Tabasco</option>
          <option value="Tamaulipas">Tamaulipas</option>
          <option value="Tlaxcala">Tlaxcala</option>
          <option value="Veracruz">Veracruz</option>
          <option value="Yucatán">Yucatán</option>
          <option value="Zacatecas">Zacatecas</option>
        </select>
      </div>

      <div class="form-group">
        <label for="periodo">Periodo de Implementación *</label>
        <select id="periodo" required>
          <option value="" disabled selected>Seleccione el periodo...</option>
          <option value="2016-2020">2016-2020</option>
          <option value="2021-2026">2021-2026</option>
          <option value="2026-2030">2026-2030</option>
        </select>
      </div>

      <div class="form-group">
        <label for="bloque">Bloque Temático</label>
        <input type="text" id="bloque" placeholder="Ej. Prevención, Transparencia, Control...">
      </div>

      <div class="form-group">
        <label for="nombre_proyecto">Nombre del Proyecto *</label>
        <input type="text" id="nombre_proyecto" required placeholder="Título formal de la iniciativa">
      </div>

      <div class="form-group">
        <label for="objetivo">Objetivo General *</label>
        <textarea id="objetivo" required placeholder="Describa brevemente la meta del proyecto..."></textarea>
      </div>

      <div class="form-group">
        <label for="enlace_documento">Enlace a Documento o Evidencia (Opcional)</label>
        <input type="url" id="enlace_documento" placeholder="https://...">
      </div>

      <button type="submit" id="btnSubmit">Enviar Registro</button>
    </form>

    <div id="msgStatus"></div>
  </div>

  <script>
    // PEGA AQUÍ LA URL DE TU WEB APP DE APPS SCRIPT:
    const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbxFUCaP0_mBzseAZWdccTBb6Am2zIWPAL41e5-AZZPF_8UDYnl6DZwpci01o6IEhxP7/exec";

    document.getElementById("projectForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      
      const btn = document.getElementById("btnSubmit");
      const msg = document.getElementById("msgStatus");

      btn.disabled = true;
      btn.textContent = "Enviando registro...";
      msg.textContent = "";

      const payload = {
        correo: document.getElementById("correo").value.trim(),
        estado: document.getElementById("estado").value,
        periodo: document.getElementById("periodo").value,
        bloque: document.getElementById("bloque").value.trim(),
        nombre_proyecto: document.getElementById("nombre_proyecto").value.trim(),
        objetivo: document.getElementById("objetivo").value.trim(),
        enlace_documento: document.getElementById("enlace_documento").value.trim()
      };

      try {
        await fetch(URL_APPS_SCRIPT, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        msg.style.color = "#15803d";
        msg.textContent = "✓ Registro recibido exitosamente. Será evaluado por el equipo validador.";
        document.getElementById("projectForm").reset();
      } catch (err) {
        msg.style.color = "#b91c1c";
        msg.textContent = "Ocurrió un error al enviar el registro. Intente nuevamente.";
      } finally {
        btn.disabled = false;
        btn.textContent = "Enviar Registro";
      }
    });
  </script>
</body>
</html>
